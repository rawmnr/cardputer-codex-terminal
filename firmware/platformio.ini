[platformio]
default_envs = cardputer_codex

[env:cardputer_codex]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 1500000
extra_scripts = post:tools/rename_output.py
build_flags =
    -DESP32S3
    -D CORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWEBSOCKETS_MAX_DATA_SIZE=16384
    -DARDUINOJSON_SLOT_ID_SIZE=2
    -DLVGL_EXTERNAL_HEADER=\"../../.pio/libdeps/cardputer_codex/lvgl/lvgl.h\"
    -DM5GFX_LVGL_SHIM_HEADER=\"../../.pio/libdeps/cardputer_codex/M5GFX/src/lgfx/v1/lvgl.h\"
    -DUSE_LVGL_UI=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -std=gnu++17
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    M5Unified=https://github.com/m5stack/M5Unified
    M5GFX=https://github.com/m5stack/M5GFX
    bblanchon/ArduinoJson
    links2004/WebSockets
    lvgl/lvgl

