    -DM5GFX_LVGL_SHIM_HEADER=\"../../.pio/libdeps/cardputer_codex_legacy/M5GFX/src/lgfx/v1/lvgl.h\"
    -DUSE_LVGL_UI=0
    -DLV_CONF_INCLUDE_SIMPLE=1
